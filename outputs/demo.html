<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Golden Glamour | Visual Directions</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101012;color:#f0ebe2;font:16px system-ui,sans-serif}button,select{font:inherit}header,main,footer{max-width:1500px;margin:auto;padding-left:32px;padding-right:32px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;padding-top:27px;padding-bottom:24px;border-bottom:1px solid #343136}.eyebrow{font-size:10px;letter-spacing:2px;color:#cfb275;text-transform:uppercase}header h1{font-size:26px;font-weight:550;letter-spacing:-.7px;margin:6px 0}header p{color:#b4aca2;margin:5px 0 0;font-size:13px}select{max-width:300px;background:#1d1c20;border:1px solid #484149;border-radius:6px;color:#e9e1d4;padding:10px;font-size:13px}main{padding-top:25px}.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#c8b485;margin-bottom:12px}.media{position:relative;aspect-ratio:104/45;background:#030305;border:1px solid #373239;border-radius:8px;overflow:hidden}.media img,.media video{width:100%;height:100%;object-fit:contain;display:block}.media [hidden]{display:none}.details{display:flex;justify-content:space-between;align-items:flex-start;gap:30px;padding:23px 0 15px}.details h2{font-size:27px;letter-spacing:-.7px;margin:0 0 9px;font-weight:500}.details p{margin:0;max-width:760px;font-size:15px;color:#bbb3a7;line-height:1.6}.use{font-size:12px;color:#d2b77d;margin-top:12px}nav{display:flex;gap:9px;flex-shrink:0;align-items:center}button{border:1px solid #57505a;border-radius:6px;background:#252329;color:#eee7db;padding:10px 17px;font-size:13px;cursor:pointer}button:hover{border-color:#d5b478}button.primary{background:#d5b478;border-color:#d5b478;color:#171414}button:disabled{opacity:.35;cursor:default}footer{padding-top:12px;padding-bottom:24px;color:#8f887e;font-size:12px;line-height:1.6;display:flex;justify-content:space-between;gap:20px}#media-note{color:#d0a56c;margin-top:9px;font-size:12px}button:focus-visible,select:focus-visible{outline:2px solid #ead3a1;outline-offset:4px}@media(max-width:800px){header{align-items:flex-start}header,main,footer{padding-left:20px;padding-right:20px}header{flex-wrap:wrap}.details{display:block}.details nav{margin-top:20px}footer{display:block}.details h2{font-size:23px}select{max-width:100%;width:100%}.media{border-radius:5px}}
@media(min-width:801px){header{padding-top:16px;padding-bottom:15px}main{padding-top:16px}.meta{margin-bottom:8px}.media{width:min(100%,calc((100dvh - 360px)*104/45));min-width:550px;margin:auto}.details{padding:16px 0 8px}footer{padding-top:6px;padding-bottom:14px}}
</style>
<header><div><div class="eyebrow">Durga / a look-and-feel conversation</div><h1>Golden Glamour</h1><p>A few ways the screen can set the mood.</p></div><select id="jump" aria-label="Choose a look"></select></header>
<main><div class="meta"><span id="category"></span><span><span id="kind"></span> · <span id="count"></span></span></div>
<div class="media"><img id="still" alt=""><video id="motion" muted loop playsinline preload="metadata" hidden></video></div>
<div class="details"><div><h2 id="title"></h2><p id="description"></p><div class="use" id="use"></div><div id="media-note" role="status"></div></div><nav aria-label="Presentation"><button id="play" hidden>Play motion</button><button id="previous" aria-label="Previous look">Previous</button><button id="next" class="primary" aria-label="Next look">Next look</button></nav></div></main>
<footer><span>Choose favorites, match them to moments, and flag anything that feels too busy.</span><span>Use ← → to change looks. Screen setup and brightness testing follow separately.</span></footer>
<script>
const looks = [
 {title:'A little movement changes everything',category:'Performance mood',file:'video/loops/P01_liquid_gold.mp4',poster:'stills/wall/P01_s2026101200.png',description:'Slow liquid gold with a calm center. A sample of how a simple background can feel alive without taking over the stage.',use:'A motion opener for performances and transitions.'},
 {title:'Emerald after dark',category:'Performance backgrounds',file:'stills/wall/P06_s2026101500.png',description:'Deep green adds a jewel-tone contrast to the gold. The middle stays quiet so performers remain the focus.',use:'An evening performance option.'},
 {title:'Pearl and champagne',category:'Performance backgrounds',file:'stills/wall/P07_s2026101401.png',description:'Soft pearls and pale gold create a gentler, more formal kind of glamour.',use:'A calm option for singers, introductions, and slower moments.'},
 {title:'Golden fanlight',category:'Performance backgrounds',file:'stills/wall/P08_s2026101402.png',description:'Broad golden folds give a sense of occasion through shape and light, with plenty of breathing room.',use:'A stronger gold identity behind performances.'},
 {title:'Crimson velvet spotlight',category:'Performance backgrounds',file:'stills/wall/P09_s2026101403.png',description:'Rich red and polished gold bring warmth and celebration while leaving room for the people on stage.',use:'A red-and-gold performance direction.'},
 {title:'Gold sound system',category:'Dance / DJ',file:'stills/wall/D06_s2026101404.png',description:'Oversized gold speaker forms make the music connection immediate. Bold, graphic, and a little playful.',use:'Dancing, DJ introductions, and high-energy moments.'},
 {title:'Midnight mirrorball',category:'Dance / DJ',file:'stills/wall/D07_s2026101405.png',description:'A familiar party symbol, given a warmer gold finish and plenty of dark space.',use:'A celebratory dance-floor direction.'},
 {title:'Sapphire gold passage',category:'Dance / DJ',file:'stills/wall/D08_s2026101506.png',description:'Cobalt glass and gold create depth and a cooler contrast. This is one of the more immersive directions.',use:'A bolder late-evening look.'},
 {title:'Chrome and rose gold',category:'Dance / DJ',file:'stills/wall/D09_s2026101507.png',description:'Oversized jewelry shapes mix warm rose gold, silver, and dark reflective surfaces.',use:'A contemporary bling option.'},
 {title:'Gold in motion',category:'Dance / DJ',file:'video/loops/D03_gold_frequency.mp4',poster:'stills/wall/D03_s2026101207.png',description:'A moving gold wave brings energy through a single readable shape.',use:'A motion sample for dancing and transitions.'},
 {title:'Marigold and gold leaf',category:'Daytime / welcome',file:'stills/wall/S03_s2026101408.png',description:'Warm flowers and gold accents make a bright, welcoming background with room for separate event information.',use:'Arrival, daytime, or supporting festival artwork.'},
 {title:'Champagne daylight',category:'Daytime / welcome',file:'stills/wall/S04_s2026101509.png',description:'Ivory, gold foil, and small diamond details carry the glamour theme into a brighter setting.',use:'A clean welcome or intermission option.'},
 {title:'Vermilion brush and gold',category:'Daytime / welcome',file:'stills/wall/S05_s2026101410.png',description:'Red pigment and gold leaf give a contemporary festive frame. Existing Durga and Sindoor imagery can remain the main artwork.',use:'A supporting daytime direction, not a replacement for existing imagery.'},
 {title:'Amber glass morning',category:'Daytime / welcome',file:'stills/wall/S06_s2026101511.png',description:'Honey-colored glass and sunlight create a fresh, airy version of the gold theme.',use:'Daytime and quieter transitions.'},
 {title:'A warm closing note',category:'Performance / transition',file:'video/loops/P05_vermilion_silk.mp4',poster:'stills/wall/P05_s2026101204.png',description:'Soft red fabric and a gold ribbon provide gentle movement. We can keep a small set of related looks across the event.',use:'A motion sample to compare with the brighter and bolder options.'}
];
const byId=id=>document.getElementById(id), video=byId('motion'), image=byId('still'), jump=byId('jump');
let index=0, revision=0;
looks.forEach((look,i)=>{const option=document.createElement('option');option.value=i;option.textContent=`${String(i+1).padStart(2,'0')} / ${look.title}`;jump.append(option);});
function show(value){
 index=Math.max(0,Math.min(looks.length-1,value));const look=looks[index],isMotion=look.file.endsWith('.mp4'),version=++revision;
 video.pause();video.removeAttribute('src');video.load();image.hidden=isMotion;video.hidden=!isMotion;byId('play').hidden=!isMotion;byId('media-note').textContent='';
 byId('title').textContent=look.title;byId('category').textContent=look.category;byId('description').textContent=look.description;byId('use').textContent=look.use;byId('kind').textContent=isMotion?'Motion sample':'Still concept';byId('count').textContent=`${index+1} / ${looks.length}`;jump.value=index;
 byId('previous').disabled=index===0;byId('next').disabled=index===looks.length-1;
 if(isMotion){video.poster=look.poster||'';video.src=look.file;video.play().catch(()=>{if(version===revision)byId('media-note').textContent='Press Play motion to start.';});}
 else{image.alt=look.title;image.src=look.file;}
}
byId('previous').onclick=()=>show(index-1);byId('next').onclick=()=>show(index+1);jump.onchange=()=>show(Number(jump.value));
byId('play').onclick=()=>video.paused?video.play().catch(()=>byId('media-note').textContent='This browser could not play the clip.'):video.pause();
video.onplay=()=>{byId('play').textContent='Pause motion';byId('media-note').textContent='';};video.onpause=()=>byId('play').textContent='Play motion';
video.onerror=()=>{if(video.getAttribute('src'))byId('media-note').textContent='Clip unavailable. Keep the video folder beside this presentation.';};
image.onerror=()=>byId('media-note').textContent='Image unavailable. Keep the stills folder beside this presentation.';
document.addEventListener('keydown',event=>{if(event.target.tagName==='SELECT')return;if(event.key==='ArrowRight'){event.preventDefault();show(index+1);}if(event.key==='ArrowLeft'){event.preventDefault();show(index-1);}});
show(0);
</script>
</html>
